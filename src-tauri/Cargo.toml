[package]
name = "doubao-batch-image-generate"
version = "1.4.0"
edition = "2021"

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-shell = { version = "2" }
tauri-plugin-updater = { version = "2" }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-notification = { version = "2" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# 仅用于 wait_result 计时路径确定性测试（start_paused）；不进入发布构建的 feature 集合
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3

[package.metadata.tauri-winres]
productName = "豆包批量生图"
fileDescription = "豆包批量生图"
originalFilename = "doubao-batch-image-generate.exe"
internalName = "doubao-batch-image-generate"
legalCopyright = "© 2026"
