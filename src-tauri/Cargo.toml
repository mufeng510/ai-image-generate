[package]
name = "doubao-batch-image-generate"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.12" }
tauri-plugin-shell = { version = "2" }
tauri-plugin-updater = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3

[package.metadata.tauri-winres]
productName = "豆包批量生图"
fileDescription = "豆包批量生图"
originalFilename = "doubao-batch-image-generate.exe"
internalName = "doubao-batch-image-generate"
legalCopyright = "© 2026"
