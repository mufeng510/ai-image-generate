name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled runtime (Node.js + Chromium)
        run: powershell -NoProfile -File scripts/fetch-runtime.ps1

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 在 GitHub 仓库 Settings > Secrets and variables > Actions 中配置：
          # TAURI_SIGNING_PRIVATE_KEY = C:\Users\mi\.tauri\ai-image-generate.key 的文件内容（整段）
          # 私钥未设置密码，因此不需要 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |-
            v1.2.0（2026-11-09）——见 CHANGELOG.md 的 [v1.2.0] 段。

            主要内容：修复「提交后等待生成超时」落 needs_manual_intervention（不再误标 failed、绝不自动重复提交，恢复网络后「继续执行」经页面探测取回生成结果）；修复 DOM 兜底提取把同一底图的缩略图与高清图各算一张的问题（每轮只下载高清图，cgen 优先）；轮次详情页图片显示修复 + 新增「打开目录」按钮；新增「默认账号每日生图额度」设置（本地自然日、已校验张数计数，仅用于任务分配参考，实际以豆包实际为准）；界面时间统一本地时区显示；修复文档级滚动条导致底部裁切；fresh 档案推广弹窗自动关闭。

            安装包自带内置运行时，安装后即可使用。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
