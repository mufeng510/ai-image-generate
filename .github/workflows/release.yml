name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled runtime (Node.js + Chromium)
        run: powershell -NoProfile -File scripts/fetch-runtime.ps1

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 在 GitHub 仓库 Settings > Secrets and variables > Actions 中配置：
          # TAURI_SIGNING_PRIVATE_KEY = C:\Users\mi\.tauri\ai-image-generate.key 的文件内容（整段）
          # 私钥未设置密码，因此不需要 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |-
            v1.6.0（2026-11-23）——见 CHANGELOG.md 的 [v1.6.0] 段。

            主要内容：
            - 生成实况图片：任务详情页新增按钮，调用外部 AI Image Process CLI 把该任务所有轮次的图片批量转为 Apple Live Photo（JPG + MOV，本地动态）。需在设置页配置 AI Image Process 目录；产物输出到该软件自己的默认目录。隐藏图等步骤沿用 AI Image Process 自身设置，失败按其报错展示。
            - 删除质量不好的图片：任务详情页每张图片右上角新增「删除」按钮，确认后删除磁盘文件与数据库记录并重算成功数（不可恢复）。
            - 任务创建即入队、项目创建/导入基于默认工作区等前期改动一并发布。

            安装包自带内置运行时，安装后即可使用。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
