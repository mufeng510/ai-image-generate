name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled runtime (Node.js + Chromium)
        run: powershell -NoProfile -File scripts/fetch-runtime.ps1

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 在 GitHub 仓库 Settings > Secrets and variables > Actions 中配置：
          # TAURI_SIGNING_PRIVATE_KEY = C:\Users\mi\.tauri\ai-image-generate.key 的文件内容（整段）
          # 私钥未设置密码，因此不需要 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |-
            v1.5.0（2026-11-12）——见 CHANGELOG.md 的 [v1.5.0] 段。

            主要内容：修复下载图片带「豆包AI生成」水印的问题——改为按 ihmily/doubao-nomark 扩展（MIT）的方式做网络拦截（/chat/completion + /im/chain/single 拦截 creations，取 creation.image.image_ori_raw 无水印原图）；取不到原图时停下等人工处理（needs_manual_intervention），不再静默下载水印展示图；2026-11-12 真实生图实测 5/5 无水印。设置页新增开关「下载完成后删除对应豆包会话（不可恢复）」（默认关闭，仅完整下载并校验的轮次才删）；Windows 下不再弹出 Node 控制台窗口。

            安装包自带内置运行时，安装后即可使用。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
