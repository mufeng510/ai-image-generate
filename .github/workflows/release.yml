name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled runtime (Node.js + Chromium)
        run: powershell -NoProfile -File scripts/fetch-runtime.ps1

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 在 GitHub 仓库 Settings > Secrets and variables > Actions 中配置：
          # TAURI_SIGNING_PRIVATE_KEY = C:\Users\mi\.tauri\ai-image-generate.key 的文件内容（整段）
          # 私钥未设置密码，因此不需要 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |-
            v1.4.0（2026-11-09）——见 CHANGELOG.md 的 [v1.4.0] 段。

            主要内容：生成完成按「预期张数」等待（全局默认 5、项目可覆盖；未满且不再增长则按已出张数继续）；提取不足自动重提取并按 identity 合并；缺图轮次标注「部分成功」并继续后续轮次；输出目录按任务归档（output/<任务名>/<时间戳>/）；任务结束（完成/失败/取消）自动关闭浏览器；设置页新增「每轮预期生成张数」、项目级覆盖、轮次详情成功/总数按预期显示。

            安装包自带内置运行时，安装后即可使用。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
