name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled runtime (Node.js + Chromium)
        run: powershell -NoProfile -File scripts/fetch-runtime.ps1

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 在 GitHub 仓库 Settings > Secrets and variables > Actions 中配置：
          # TAURI_SIGNING_PRIVATE_KEY = C:\Users\mi\.tauri\ai-image-generate.key 的文件内容（整段）
          # 私钥未设置密码，因此不需要 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |-
            v1.7.1（2026-11-25）——见 CHANGELOG.md 的 [v1.7.1] 段。

            主要内容（修复版）：
            - 确认框不再抢先执行：全部改为 Tauri 异步对话框，输入改应用内弹窗，避免“未确认就执行 + 同时弹报错框”。
            - 设置页改为实时保存，去掉各配置项旁边和页面底部的重复保存按钮。
            - output 下软链接 / junction 挂载的任务文件夹不再报“路径不在项目输出目录内”，打开/查看/删图均可用。
            - 中文 Windows 下 AI Image Process 的 GBK 输出不再误报“stream did not contain valid UTF-8”，实况生成成功后能正确识别。

            安装包自带内置运行时，安装后即可使用。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
