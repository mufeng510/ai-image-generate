name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled runtime (Node.js + Chromium)
        run: powershell -NoProfile -File scripts/fetch-runtime.ps1

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 在 GitHub 仓库 Settings > Secrets and variables > Actions 中配置：
          # TAURI_SIGNING_PRIVATE_KEY = C:\Users\mi\.tauri\ai-image-generate.key 的文件内容（整段）
          # 私钥未设置密码，因此不需要 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |-
            v1.7.0（2026-11-25）——见 CHANGELOG.md 的 [v1.7.0] 段。

            主要内容：
            - 项目工作台：进入项目后任务列表直接来自 output 目录下现存的文件夹，一个文件夹即一条任务记录；删除文件夹记录自动消失。
            - 生成实况图片闭环：接入 AI Image Process 0.10+ 的 --delete-originals，成功后自动删除任务文件夹并清理任务记录；旧版自动保留原件。设置页可关闭自动删除。
            - 筛选删图、账号统计持久化、日志/通知任务名快照、一次性维护（回填清单/清理失效记录）。
            - 任务名改为唯一目录名（项目名-日期-时分秒-毫秒），不再同日复用文件夹。

            安装包自带内置运行时，安装后即可使用。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
