name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled runtime (Node.js + Chromium)
        run: powershell -NoProfile -File scripts/fetch-runtime.ps1

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 在 GitHub 仓库 Settings > Secrets and variables > Actions 中配置：
          # TAURI_SIGNING_PRIVATE_KEY = C:\Users\mi\.tauri\ai-image-generate.key 的文件内容（整段）
          # 私钥未设置密码，因此不需要 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |-
            v1.3.0（2026-11-09）——见 CHANGELOG.md 的 [v1.3.0] 段。

            主要内容：新增验证码/人机风控页检测（captcha_required → 诊断快照 + needs_manual_intervention，绝不自动绕过）；日志 CSV 导出公式注入中和、CSV 渲染抽纯函数并逐单元格对账 0 不符；wait_result 计时路径确定性测试（48/48）；Playwright Trace 真实任务验证回放通过；B 系列故障注入实测闭合验收 #13–#19。

            安装包自带内置运行时，安装后即可使用。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
